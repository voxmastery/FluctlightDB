name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release --all-targets

      - name: Format check
        run: cargo fmt --all -- --check

  supply-chain:
    name: rust supply chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  miri-unsafe-audit:
    name: miri (WAL / store paths)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri setup
        run: cargo miri setup

      - name: Miri tests (wal + store)
        run: cargo miri test -p fluctlightdb --lib wal_ persistence_roundtrip

  chaos-jepsen:
    name: chaos / crash recovery (Jepsen-style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run jepsen-chaos suite
        run: bash scripts/jepsen-chaos.sh

  python-sdk:
    name: python-sdk (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdks/python

      - name: Run Python unit tests
        working-directory: sdks/python
        run: python -m unittest discover -s tests -v

  python-sdk-native:
    name: python-sdk-native (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native wheel
        run: |
          pip install maturin
          maturin build --release -o dist --manifest-path crates/fluctlight-py/Cargo.toml

      - name: Install SDK + native
        run: |
          pip install -e ./sdks/python
          pip install dist/*.whl

      - name: Run native integration tests
        working-directory: sdks/python
        run: python -m unittest tests.test_project.TestProjectInit.test_connect_and_handoff -v

  pypi-wheel-smoke:
    name: pypi-wheel-smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: windows-latest, python: "3.11" }
          - { os: ubuntu-24.04-arm, python: "3.11" }
          - { os: windows-11-arm, python: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build abi3 native wheel (+ sdist on Linux only)
        shell: bash
        run: |
          pip install maturin build
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            maturin build --release -o dist-native --manifest-path crates/fluctlight-py/Cargo.toml --sdist
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            maturin build --release -o dist-native --manifest-path crates/fluctlight-py/Cargo.toml --target universal2-apple-darwin
          else
            maturin build --release -o dist-native --manifest-path crates/fluctlight-py/Cargo.toml
          fi
          cd sdks/python && python -m build -o ../../dist-sdk

      - name: Install published-style artifacts (no source tree)
        shell: bash
        run: |
          python -m venv /tmp/flct-smoke
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PIP=/tmp/flct-smoke/Scripts/pip
            PY=/tmp/flct-smoke/Scripts/python
          else
            PIP=/tmp/flct-smoke/bin/pip
            PY=/tmp/flct-smoke/bin/python
          fi
          "$PIP" install --upgrade pip
          "$PIP" install dist-native/*.whl dist-sdk/*.whl
          "$PY" -c "import fluctlightdb_native; import fluctlightdb; print('ok', fluctlightdb_native.__name__)"
