name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  publish-sdk:
    name: fluctlightdb (Python SDK)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fluctlightdb/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          cd sdks/python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  build-native:
    name: build native (${{ matrix.id }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-latest
            platform: linux
            sdist: true
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            sdist: false
          - id: macos-universal2
            os: macos-latest
            platform: macos
          - id: windows-x64
            os: windows-latest
            platform: windows
          - id: windows-arm64
            os: windows-11-arm
            platform: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux manylinux abi3 wheel
        if: matrix.platform == 'linux'
        working-directory: crates/fluctlight-py
        run: |
          pip install maturin
          if [[ "${{ matrix.sdist }}" == "true" ]]; then
            maturin build --release --out dist --sdist
          else
            maturin build --release --out dist
          fi

      - name: Build macOS universal2 abi3 wheel
        if: matrix.platform == 'macos'
        working-directory: crates/fluctlight-py
        run: |
          pip install maturin
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          maturin build --release --out dist --target universal2-apple-darwin

      - name: Build Windows abi3 wheel
        if: matrix.platform == 'windows'
        working-directory: crates/fluctlight-py
        shell: bash
        run: |
          pip install maturin
          maturin build --release --out dist

      - name: List artifacts
        shell: bash
        working-directory: crates/fluctlight-py
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: crates/fluctlight-py/dist/*
          if-no-files-found: error

  publish-native:
    name: fluctlightdb-native (all platforms)
    needs: build-native
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fluctlightdb-native/
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: native-*
          merge-multiple: true

      - name: List wheels to publish
        run: ls -la dist-all/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-all/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
