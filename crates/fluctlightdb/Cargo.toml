[package]
name = "fluctlightdb"
description = "Embedded memory engine for AI agents — third data model: experience(), activate(), provenance, consolidation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
cortex-sim = []
distributed = [
    "dep:hmac",
    "dep:openraft",
    "dep:rand",
    "dep:rustls",
    "dep:tokio-rustls",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bincode = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fast-hnsw = "1.0.1"
sha2 = "0.10"
fs2 = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
hmac = { version = "0.12", optional = true }
openraft = { version = "=0.9.24", features = ["serde", "storage-v2"], optional = true }
rand = { version = "0.8", optional = true }
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }

[[bin]]
name = "fluctlight-chaos-worker"
path = "src/bin/chaos_worker.rs"
test = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rcgen = "=0.13.2"

[[bin]]
name = "fluctlight-rekey"
path = "src/bin/rekey.rs"
test = false
