# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# CI: `cargo deny check`

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Documented accepted risks — see SECURITY.md (not silent gaps).
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x is the on-disk engram wire format; migration to bincode 2 is a breaking storage change tracked in SECURITY.md" },
  { id = "RUSTSEC-2026-0186", reason = "transitive via fast-hnsw/memmap2 0.9.10 until upstream fix — mmap paths in Miri CI" },
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 via openraft(=0.9.24, distributed feature, off by default) -> byte-unit -> rust_decimal; rkyv archive deserialization is never used in this codebase" },
]
unmaintained = "all"
unsound = "all"
yanked = "warn"
unused-ignored-advisory = "allow"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
  "MPL-2.0",
]
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
