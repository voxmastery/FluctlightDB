# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# CI: `cargo deny check`

[graph]
all-features = true

[advisories]
vulnerability = "warn"
unmaintained = "warn"
unsound = "warn"
yanked = "warn"
ignore = [
  # Track upgrades in issues; do not silently ignore new IDs.
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "OpenSSL",
  "MPL-2.0",
]
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
