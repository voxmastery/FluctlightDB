# cargo-audit reads this file; keep it in lockstep with [advisories].ignore in
# deny.toml — both lists are documented accepted risks in SECURITY.md, not
# silent gaps.
[advisories]
ignore = [
  "RUSTSEC-2025-0141", # bincode 1.x is the on-disk engram wire format; bincode 2 is a breaking storage change
  "RUSTSEC-2026-0186", # transitive via fast-hnsw/memmap2 0.9.10 until upstream fix; mmap paths covered by Miri CI
]
